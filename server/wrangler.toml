# Wall's sync server. Free Workers plan only: no R2, no KV, no paid bindings.
# Past a free limit Cloudflare returns errors; there is nothing here to bill.
name = "wall"
main = "src/index.js"
compatibility_date = "2026-10-01"
send_metrics = false
workers_dev = true
preview_urls = false

# The web version of Wall, built by tools/build-server.ps1. Requests for these
# files are free and not counted.
[assets]
directory = "./public"
run_worker_first = ["/api/*"]

[vars]
# SHA-256 (hex) of the owner key that Wall on the owner's PC keeps. The key
# itself is never on the server. Empty: nobody is the owner, nothing works.
OWNER_HASH = ""
# Uploads stop here (bytes). The free plan stores 5 GB in all.
MAX_MEDIA_BYTES = "4000000000"

[[durable_objects.bindings]]
name = "LIBRARY"
class_name = "LibraryDO"

[[durable_objects.bindings]]
name = "MEDIA"
class_name = "MediaDO"

# SQLite storage: the only kind the free plan has.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LibraryDO", "MediaDO"]
