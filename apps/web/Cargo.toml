[package]
name = "wall-web"
description = "Wall in the browser: WASM + WebGL2."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid.workspace = true
wall-app.workspace = true
wall-render.workspace = true
glow.workspace = true
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
image = { workspace = true, features = ["png"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "WebGl2RenderingContext", "PointerEvent", "MouseEvent", "WheelEvent", "KeyboardEvent", "DragEvent", "DataTransfer", "FileList", "File", "Blob", "AddEventListenerOptions", "ClipboardEvent", "HtmlVideoElement", "HtmlMediaElement", "Url", "console", "HtmlInputElement", "Navigator", "Clipboard", "Response", "BlobPropertyBag", "HtmlAnchorElement", "Storage"] }
