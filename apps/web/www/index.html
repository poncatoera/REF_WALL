<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wall</title>
  <style>
    html, body { margin: 0; height: 100%; background: #131416; overflow: hidden; }
    html[data-theme="light"], html[data-theme="light"] body { background: #f3f3f5; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  </style>
  <script>
    // Never over plain http: a share link's secret would go along unprotected.
    if (location.protocol === "http:" && !["127.0.0.1", "localhost"].includes(location.hostname)) {
      location.replace("https:" + location.href.slice(5));
    }
    // The theme Wall last used (it keeps this in sync), before the first frame.
    try { if (localStorage.getItem("wall.light") === "1") document.documentElement.dataset.theme = "light"; } catch (e) {}
  </script>
</head>
<body>
  <canvas id="wall"></canvas>
  <script type="module">
    import init, { start } from "./pkg/wall_web.js";
    await init();
    start("wall");
  </script>
</body>
</html>
